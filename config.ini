; Nifty 500 AI daily job - settings.
; Paths are relative to this folder unless you give an absolute path.

[paths]
data_dir = data
output_dir = output
log_dir = logs
model_dir = model
static_dir = static

[run]
; parallel processes for the indicator + pattern scan (2 suits a 2-core server)
workers = 2
; delete daily Excel files older than this many days (0 = keep all)
keep_reports_days = 0
; daily engine snapshots kept in data/runs (used by --report-only)
keep_run_bundles = 30
; annotated charts per timeframe in the 'Charts' sheet
charts_st = 8
charts_mt = 3
charts_lt = 3

[sources]
; official NSE files first, GitHub mirrors as fallback ({ddmmyyyy} = session date)
nse_bhav_url = https://nsearchives.nseindia.com/products/content/sec_bhavdata_full_{ddmmyyyy}.csv
mirror_bhav_url = https://raw.githubusercontent.com/tilak999/NSE-Data-bank/main/data/sec_bhavdata_full_{ddmmyyyy}.csv
nse_index_url = https://nsearchives.nseindia.com/content/indices/ind_close_all_{ddmmyyyy}.csv
mirror_index_url = https://raw.githubusercontent.com/Chaudharyrohit2506/nse-daily-ohlcv/main/data/chatgpt/index/{file}
constituents_url = https://niftyindices.com/IndexConstituent/ind_nifty500list.csv
constituents_url2 = https://nsearchives.nseindia.com/content/indices/ind_nifty500list.csv
history_url = https://raw.githubusercontent.com/kaushikghoshindia/NSE500Tracker/main/data/stocks/{symbol_lower}.csv
http_timeout = 30
http_retries = 3
; corporate proxy if the server needs one, e.g. http://proxy.company.local:8080 (leave empty if not)
proxy =
; re-download the Nifty 500 constituent list every N days
refresh_days = 7

[research]
; quarterly results / news were checked by web search on 27-Sep-2026; they are shown in the Excel until this date
valid_until = 2026-11-15
note = Latest quarterly results (Q1 FY27) were checked by web search on 27-Sep-2026 - context only.
